[package]
name = "miden-watch"
version = "0.15.0"
edition = "2024"
description = "A terminal UI block explorer for the Miden blockchain"
license = "MIT"
repository = "https://github.com/sergerad/miden-watch"
keywords = ["miden", "blockchain", "tui", "explorer"]
categories = ["command-line-utilities"]

[[bin]]
name = "miden-watch"
path = "src/main.rs"

[dependencies]
# Miden
miden-client = { version = "0.15", features = ["std", "tonic"] }

# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Error handling
color-eyre = "0.6"

# Time
chrono = "0.4"

# URL parsing
url = "2"
